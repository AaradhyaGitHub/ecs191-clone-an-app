<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parking near Olson Hall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#022851}a:hover{color:#011a36}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECEEE8; color: #0E1726; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g transform="translate(-77,-330)">
<rect x="-500" y="-500" width="1400" height="1900" fill="#ECEEE8"></rect>
<g fill="#E1E4DD">

<rect x="208" y="238" width="64" height="52" rx="5"></rect>
<rect x="288" y="238" width="84" height="52" rx="5"></rect>
<rect x="388" y="-62" width="90" height="352" rx="5"></rect>
</g>
<g fill="#DADDD5">
<rect x="96" y="318" width="40" height="28" rx="3"></rect>
<rect x="214" y="320" width="54" height="34" rx="3"></rect>
<rect x="296" y="336" width="62" height="26" rx="3"></rect>
<rect x="244" y="376" width="44" height="40" rx="3"></rect>
<rect x="300" y="380" width="56" height="30" rx="3"></rect>
<rect x="340" y="440" width="30" height="58" rx="3"></rect>
<rect x="268" y="456" width="34" height="26" rx="3" fill="#C9CEC6"></rect>
<rect x="232" y="512" width="44" height="30" rx="3"></rect>
<rect x="296" y="508" width="20" height="40" rx="3"></rect>
<rect x="400" y="340" width="60" height="44" rx="3"></rect>
<rect x="400" y="430" width="48" height="70" rx="3"></rect>
<rect x="400" y="520" width="56" height="30" rx="3"></rect>
<rect x="110" y="470" width="50" height="40" rx="3"></rect>
</g>
<rect x="228" y="438" width="100" height="62" rx="10" fill="#CFE3C7" opacity="0.9"></rect>
<g stroke="#FFFFFF" fill="none" stroke-linecap="round">
<path d="M230 432 H380 M230 300 V560 M300 560 V690 M90 420 H190 M380 560 V690" stroke-width="4"></path>
<path d="M-500 300 H900" stroke="#D9DCD4" stroke-width="13"></path>
<path d="M-500 300 H900" stroke-width="10"></path>
<path d="M-500 560 C100 560 260 566 900 552" stroke-width="7"></path>
<path d="M200 300 C202 420 196 560 215 690" stroke-width="7"></path>
<path d="M380 -500 V700" stroke-width="7"></path>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B7380" letter-spacing="0.3">
<text x="250" y="292">Russell Blvd</text>
</g>
</g>
</svg>

<div style="position: absolute; left: 194px; top: 126px; display: flex; align-items: center; gap: 6px; z-index: 4" aria-label="Olson Hall" role="img">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #022851; border: 2px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(2,40,81,0.35)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M11 21v-3h2v3"></path></svg>
</span>
<span style="background: #FFFFFF; border-radius: 8px; padding: 4px 8px; font-size: 13px; font-weight: 700; color: #022851; box-shadow: 0 2px 6px rgba(2,40,81,0.18)">Olson Hall</span>
</div>

<sc-for list="{{lots}}" as="pin" hint-placeholder-count="3">
<button onClick="{{pin.pick}}" aria-label="{{pin.pinLabel}}" style="position: absolute; left: {{pin.pinLeft}}px; top: {{pin.pinTop}}px; width: {{pin.pinSize}}px; height: {{pin.pinSize}}px; z-index: {{pin.z}}; border-radius: 50%; border: 3px solid #FFFFFF; background: {{pin.badgeBg}}; color: {{pin.badgeFg}}; font: 700 {{pin.pinFont}}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; box-shadow: 0 4px 10px rgba(2,40,81,0.35)">{{pin.n}}</button>
</sc-for>

<section aria-label="Closest student lots to Olson Hall" style="position: absolute; left: 0; right: 0; bottom: 0; height: 620px; box-sizing: border-box; padding: 8px 16px 30px; background: #F4F5F7; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(2,40,81,0.12); display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 5px; border-radius: 3px; background: #C9CED6; align-self: center"></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px">Parking near Olson Hall</h1>
<p style="margin: 0; font-size: 13px; color: #4A5565">Closest to Olson Hall · drive times if you leave in 10 min</p>
</div>
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #E4E7EC; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B3442" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{lots}}" as="lot" hint-placeholder-count="3">
<article style="background: #FFFFFF; border-radius: 18px; border: 2px solid {{lot.border}}; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(2,40,81,0.06)">
<button onClick="{{lot.pick}}" style="border: 0; background: transparent; padding: 0; margin: 0; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 10px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 12px; min-height: 52px; width: 100%">
<span style="width: 32px; height: 32px; border-radius: 50%; background: {{lot.badgeBg}}; color: {{lot.badgeFg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none">{{lot.n}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 17px; font-weight: 600">{{lot.name}}</span>
<span style="display: flex; gap: 6px">
<sc-for list="{{lot.zones}}" as="zone" hint-placeholder-count="2">
<span title="{{zone.label}}" style="min-width: 24px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: #E7ECF4; color: #022851; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{zone.z}}</span>
</sc-for>
</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; flex: none">
<span style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px">{{lot.time}}</span>
<span style="font-size: 12px; color: #4A5565">drive</span>
</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #2B3442; padding-left: 44px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#022851" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M9 21l2.5-6.5L14 17v4M11.5 14.5 12.5 9l-3.5 2-1.5 3.5M12.5 9l2 4 3 1"></path></svg>
<span>{{lot.walk}}</span>
</span>
</button>
<sc-if value="{{lot.first}}" hint-placeholder-val="{{ true }}">
<a href="NavigateSheet.dc.html" style="height: 44px; border-radius: 12px; background: #022851; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">
<svg width="17" height="17" viewBox="0 0 24 24" fill="#FFBF00" aria-hidden="true"><path d="M3 11.2 21 3l-8.2 18-2.1-7.7z"></path></svg>
<span>Navigate</span>
</a>
</sc-if>
<sc-if value="{{lot.notFirst}}" hint-placeholder-val="{{ false }}">
<button style="height: 44px; border-radius: 12px; border: 0; background: #022851; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="#FFBF00" aria-hidden="true"><path d="M3 11.2 21 3l-8.2 18-2.1-7.7z"></path></svg>
<span>Navigate</span>
</button>
</sc-if>
</article>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) ?? 0;
const base = [
{ n: 1, name: 'Quad Structure', zones: ['C'], time: '7 min', walk: 'About 4 min walk (320 m) to Olson', x: 173, y: 100 },
{ n: 2, name: 'Lot 25', zones: ['C', 'L'], time: '9 min', walk: 'About 5 min walk (400 m) to Olson', x: 253, y: 190 },
{ n: 3, name: 'Lot 30', zones: ['C', 'L'], time: '9 min', walk: 'About 7 min walk (570 m) to Olson', x: 124, y: 66 }
];
const lots = base.map((l, i) => {
const on = i === sel;
const s = on ? 40 : 34;
return {
n: l.n, name: l.name, time: l.time, walk: l.walk,
zones: l.zones.map((z) => ({ z: z, label: 'Zone ' + z })),
pick: () => this.setState({ sel: i }),
border: on ? '#FFBF00' : '#FFFFFF',
badgeBg: on ? '#FFBF00' : '#022851',
badgeFg: on ? '#022851' : '#FFFFFF',
pinSize: s, pinLeft: l.x - s / 2, pinTop: l.y - s / 2,
pinFont: on ? 17 : 15, z: on ? 3 : 2,
pinLabel: l.n + '. ' + l.name + ', ' + l.walk,
first: i === 0, notFirst: i !== 0
};
});
return { lots: lots };
}
}
</script>
</body>
</html>
