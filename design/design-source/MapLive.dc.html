<script type="text/x-dc" data-dc-script data-props='{"startLevel":{"editor":"int","default":1,"min":0,"max":5},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const LV = [
{ name: 'City', s: 0.3, cx: 250, cy: 620 },
{ name: 'Campus areas', s: 0.5, cx: 220, cy: 560 },
{ name: 'Clusters', s: 0.85, cx: 290, cy: 470 },
{ name: 'Lots', s: 1.15, cx: 260, cy: 430 },
{ name: 'Lots + zones', s: 1.7, cx: 285, cy: 370 },
{ name: 'Your zone', s: 2.6, cx: 290, cy: 345 }
];
const start = Math.max(0, Math.min(5, Number(this.props.startLevel ?? 1) || 0));
const level = st.level ?? start;
const cx = st.cx ?? LV[level].cx;
const cy = st.cy ?? LV[level].cy;
const s = LV[level].s;
const tx = 195 - cx * s;
const ty = 430 - cy * s;
const P = (x, y) => ({ x: Math.round((x * s + tx) * 10) / 10, y: Math.round((y * s + ty) * 10) / 10 });
const go = (l, x, y) => { const nl = Math.max(0, Math.min(5, l)); this.setState({ level: nl, cx: x, cy: y }); };
const step = (d) => {
const nl = Math.max(0, Math.min(5, level + d));
if (nl === level) return;
const t = LV[nl];
go(nl, cx + (t.cx - cx) * 0.6, cy + (t.cy - cy) * 0.6);
};
const vis = (on, i) => ({ op: on ? 1 : 0, sc: on ? 1 : 0.4, pe: on ? 'auto' : 'none', tab: on ? 0 : -1, delay: on ? 140 + i * 50 : 0 });

const donut = (d, lvl, i) => {
const on = level === lvl;
const n = d.c + d.l;
const r = n >= 40 ? 34 : n >= 20 ? 30 : n >= 8 ? 24 : 21;
const size = 2 * r + 12;
const circ = 2 * Math.PI * r;
const gap = d.c > 0 && d.l > 0 ? 3 : 0;
const cLen = circ * d.c / n;
const lLen = circ * d.l / n;
const p = P(d.x, d.y);
return Object.assign({
name: d.name, n: n, x: p.x, y: p.y,
size: size, half: size / 2, negHalf: -size / 2, r: r, halo: r + 6, inner: r - 5,
viewBox: '0 0 ' + size + ' ' + size,
font: n >= 20 ? 20 : 16,
cDash: (on ? Math.max(cLen - gap, 0) : 0).toFixed(1) + ' ' + circ.toFixed(1),

aria: d.name + ', ' + n + ' student lots: ' + d.c + ' zone C, ' + d.l + ' zone L. Zoom in.',
pick: () => go(lvl + 1, d.x, d.y)
}, vis(on, i));
};

];

];

return Object.assign({

}, vis(lotsOn, i));

];
const zoneLabels = ZL.map((d, i) => {

return Object.assign({

}, v);
});

];

const me = P(290, 334);
const dots = LV.map((l, i) => ({ h: i === level ? 16 : 6, bg: i === level ? '#FFBF00' : '#C5CBD4' })).reverse();
const card = level === 5;
return {

zonesOpacity: level === 5 ? 1 : level === 4 ? 0.55 : 0,
donuts: donuts, lots: lots, greyDots: greyDots, zoneLabels: zoneLabels, places: places, me: me, dots: dots,
otherW: level >= 3 ? 150 : 0, otherOp: level >= 3 ? 1 : 0,
levelName: LV[level].name,
labelTop: 280 + 44 + 4 + (5 - level) * 18 - 2,
cardOp: card ? 1 : 0, cardY: card ? 0 : 24, cardPe: card ? 'auto' : 'none', cardHidden: card ? 'false' : 'true',
zoomIn: () => step(1),
zoomOut: () => step(-1),
locate: () => go(5, 290, 345),
onWheel: (e) => {
const now = Date.now();
if (now - (this._wheelAt || 0) < 550) return;
this._wheelAt = now;
step(e.deltaY < 0 ? 1 : -1);
}
};
}
}
